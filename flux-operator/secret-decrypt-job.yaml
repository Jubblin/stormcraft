# Decrypts flux-operator/git-secret.enc.yaml (SOPS/age) and applies it as
# the `git` Secret Flux's source-controller reads to clone this repo.
# Needs the `age` private key already present on-cluster as Secret
# sops-age/age.agekey — that's the one manual step this design doesn't
# automate (see docs/designs/flux-auto-bootstrap.md). Create it once:
#   kubectl create secret generic sops-age -n flux-system \
#     --from-file=age.agekey=<path to your age private key>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sops-decrypt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sops-decrypt
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sops-decrypt
subjects:
  - kind: ServiceAccount
    name: sops-decrypt
roleRef:
  kind: Role
  name: sops-decrypt
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sops-decrypt-git-secret
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 1800
  # If the age-key Secret never shows up, the pod can't start (missing
  # volume) and this deadline fails the Job loudly instead of leaving it
  # Pending forever — visible via `kubectl -n flux-system get jobs`.
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: sops-decrypt
      restartPolicy: Never
      containers:
        - name: decrypt
          image: alpine/k8s:1.32.13
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache sops age >/dev/null
              SOPS_AGE_KEY_FILE=/age/age.agekey \
                sops -d /encrypted/git-secret.enc.yaml | kubectl apply -f -
          volumeMounts:
            - mountPath: /encrypted
              name: git-secret-encrypted
            - mountPath: /age
              name: sops-age
              readOnly: true
      volumes:
        - name: git-secret-encrypted
          configMap:
            name: git-secret-encrypted
        - name: sops-age
          secret:
            secretName: sops-age
