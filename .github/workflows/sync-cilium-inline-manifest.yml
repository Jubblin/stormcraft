name: Sync Cilium inline manifest

# Scoped to pushes on main, not every branch: this opens its fix straight
# to main, so running it on a feature branch would bundle that branch's
# unmerged commits into the same PR. Treat it as post-merge reconciliation
# — if cilium/bootstrap-job/*.yaml or cilium/values.yaml change on a PR
# branch, talos/patches/cni-kubeproxy.yaml only gets brought back in sync
# once that PR lands on main.
on:
  push:
    branches: [main]
    paths:
      - "cilium/**"
      - "flux-operator/**"
      - "talos/patches/cni-kubeproxy.yaml"
      - "hack/sync-cilium-inline-manifest.py"
      - ".github/workflows/sync-cilium-inline-manifest.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      # This is the validation step: if the script produces no diff, the
      # file was already in sync and the job ends here with nothing to do.
      - name: Regenerate talos/patches/cni-kubeproxy.yaml
        run: python3 hack/sync-cilium-inline-manifest.py

      - name: Open a PR if it's now out of sync
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore: sync cilium inline manifest with cilium/bootstrap-job"
          branch: chore/sync-cilium-inline-manifest
          base: main
          delete-branch: true
          title: "chore: sync Cilium bootstrap inline manifest"
          body: |
            Auto-generated by `.github/workflows/sync-cilium-inline-manifest.yml`.

            `talos/patches/cni-kubeproxy.yaml`'s `inlineManifests` block was
            out of sync with `kubectl kustomize cilium/` (i.e.
            `cilium/bootstrap-job/*.yaml` and/or `cilium/values.yaml`
            changed since it was last regenerated). This PR brings it back
            in sync — review the diff before merging.
