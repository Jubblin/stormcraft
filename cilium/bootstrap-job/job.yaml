# Applied via `kubectl apply -k cilium/` (see ../kustomization.yaml, not
# one in this directory — Kustomize won't read ../values.yaml from here).
#
# Runs `helm install cilium` from inside the cluster instead of from an
# operator's machine.
#
# Why hostNetwork: at this point in the bootstrap there is no CNI yet, so
# nodes sit NotReady and normal pods can't get an IP. This Job's pod uses
# the host's network namespace directly (the same trick kube-proxy and
# every CNI's own DaemonSet use), which needs no CNI at all — so it can
# schedule and run before Cilium exists to make itself un-needed.
#
# dnsPolicy is deliberately Default (the node's own /etc/resolv.conf), not
# ClusterFirstWithHostNet: CoreDNS isn't up yet either, so cluster DNS
# would just fail closed. helm.cilium.io needs to resolve via the node's
# real upstream resolver.
#
# API access uses Talos's own kube-system/kubeconfig-in-cluster ConfigMap
# (auto-created at bootstrap by machined's k8s.ManifestController — see
# internal/app/machined/pkg/controllers/k8s/internal/k8stemplates/kubeconfig.go
# in siderolabs/talos) instead of helm/kubectl's implicit in-cluster
# auto-detection. It's a kubeconfig pointed at KubePrism
# (https://127.0.0.1:7445), which only resolves correctly because this
# pod is hostNetwork: true — the cert/token it references are still read
# from this pod's own mounted ServiceAccount, so the cluster-admin
# binding below is still required.
#
# The preflight initContainer checks cluster state before helm ever runs
# (initContainers must exit 0 before the main container starts, so this
# is a hard gate, not a warning): API reachable through the mounted
# kubeconfig, the expected number of control-plane nodes joined, kube-proxy
# actually absent (confirms talos/patches/cni-kubeproxy.yaml took effect —
# if it's still running, Cilium's kube-proxy-replacement mode and
# kube-proxy would fight over the same iptables/BPF rules), and no
# previous cilium release stuck mid-install from a killed/failed prior run
# (that state makes plain `helm upgrade --install` fail confusingly).
apiVersion: batch/v1
kind: Job
metadata:
  name: cilium-install
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      serviceAccountName: cilium-installer
      hostNetwork: true
      dnsPolicy: Default
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: preflight
          # alpine/k8s bundles kubectl + helm together (the kubectl version
          # tracks the tag — pick one close to the cluster's k8s version).
          image: alpine/k8s:1.32.13
          command: ["/bin/sh", "-c"]
          env:
            - name: KUBECONFIG
              value: /etc/kubeconfig/kubeconfig
            - name: EXPECTED_CONTROL_PLANE_COUNT
              value: "3"
          args:
            - |
              set -eu

              echo "Checking API server is reachable..."
              kubectl get --raw=/healthz

              echo "Checking control-plane node count..."
              cp_count=$(kubectl get nodes -l node-role.kubernetes.io/control-plane -o name | wc -l)
              if [ "$cp_count" -ne "$EXPECTED_CONTROL_PLANE_COUNT" ]; then
                echo "Expected $EXPECTED_CONTROL_PLANE_COUNT control-plane nodes, found $cp_count" >&2
                exit 1
              fi

              echo "Checking kube-proxy is disabled..."
              if kubectl -n kube-system get daemonset kube-proxy >/dev/null 2>&1; then
                echo "kube-proxy DaemonSet is still present — talos/patches/cni-kubeproxy.yaml (cluster.proxy.disabled) was not applied to this cluster" >&2
                exit 1
              fi

              echo "Checking for a stuck previous cilium release..."
              if helm status cilium -n kube-system >/tmp/cilium-status.txt 2>/dev/null; then
                existing_status=$(awk '/^STATUS:/ {print $2}' /tmp/cilium-status.txt)
                if [ "$existing_status" != "deployed" ]; then
                  echo "Existing cilium release is in state '$existing_status', not 'deployed' — resolve manually (e.g. helm uninstall cilium -n kube-system) before retrying" >&2
                  exit 1
                fi
              fi

              echo "Preflight checks passed."
          volumeMounts:
            - name: kubeconfig-in-cluster
              mountPath: /etc/kubeconfig
              readOnly: true
      containers:
        - name: cilium-install
          image: alpine/k8s:1.32.13
          command: ["/bin/sh", "-c"]
          env:
            - name: KUBECONFIG
              value: /etc/kubeconfig/kubeconfig
          args:
            - |
              set -eu
              helm repo add cilium https://helm.cilium.io/
              helm repo update
              helm upgrade --install cilium cilium/cilium \
                --version 1.18.0 \
                --namespace kube-system \
                -f /values/values.yaml \
                --wait --timeout 10m
          volumeMounts:
            - name: values
              mountPath: /values
            - name: kubeconfig-in-cluster
              mountPath: /etc/kubeconfig
              readOnly: true
      volumes:
        - name: values
          configMap:
            name: cilium-values
        - name: kubeconfig-in-cluster
          configMap:
            name: kubeconfig-in-cluster
