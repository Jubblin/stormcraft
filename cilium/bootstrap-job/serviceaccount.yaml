# Bootstrap-only: the installer needs to create CRDs, ClusterRoles and
# DaemonSets cluster-wide, so it runs as cluster-admin. Delete this
# ServiceAccount/ClusterRoleBinding once Cilium is confirmed healthy —
# see the cleanup command in ../../talos/README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilium-installer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cilium-installer
subjects:
  - kind: ServiceAccount
    name: cilium-installer
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
