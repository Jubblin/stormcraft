# Controlplane-only patch (--config-patch-control-plane / Omni ControlPlane patches).
#
# Nodes get their real address from DHCP, but with 3 control planes the
# cluster still needs one stable address for the Kubernetes/Talos API
# endpoint. Talos can float a virtual IP across the control plane nodes
# itself, so no external load balancer is required.
#
# Before generating configs or syncing the Omni cluster template:
#   1. Reserve <VIP_IP> in DHCP (or keep it out of the lease pool).
#   2. Replace <IFACE> with the NIC name (usually eth0 on Proxmox virtio).
#      Discover with: talosctl get links --insecure -n <node-ip>
#   3. Replace both placeholders in this file (do not leave the angle brackets).
machine:
  network:
    interfaces:
      - interface: <IFACE>
        dhcp: true
        vip:
          ip: <VIP_IP>
